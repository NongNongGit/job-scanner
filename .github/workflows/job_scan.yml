name: Daily Job Scanner

on:
  schedule:
    - cron: "0 19 * * *"   # 8:00 AM NZDT
    - cron: "0 0 * * *"    # 1:00 PM NZDT
    - cron: "0 5 * * *"    # 6:00 PM NZDT
    - cron: "30 10 * * *"  # 11:30 PM NZDT
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python main.py
